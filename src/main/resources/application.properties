# ---- Server ----
server.port=8090
server.servlet.session.timeout=7d
spring.web.resources.cache.period=0

# ---- MySQL (kintai 와 같은 로컬 MySQL, DB 이름만 myday_db) ----
# createDatabaseIfNotExist=true : DB 를 직접 만들 필요 없음
spring.datasource.url=jdbc:mysql://localhost:3306/myday_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema.sql 을 시작할 때마다 실행 (CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---- Mail ----
# SMTP 를 설정하지 않으면 '개발 모드'로 동작: 메일 내용이 콘솔에 출력되고 인증 코드가 화면에 표시됩니다.
# 실제 메일을 보내려면 프로젝트 폴더에 local.properties 를 만드세요 (local.properties.example 참고)
spring.config.import=optional:file:./local.properties
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${spring.mail.username:no-reply@myday.local}

# ---- Demo ----
# true 이면 demo@myday.app / Demo1234! 체험 계정을 자동 생성
app.demo.enabled=true
